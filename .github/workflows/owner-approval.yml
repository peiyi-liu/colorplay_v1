name: Owner approval

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request targeting staging
        required: true
        type: number
      head_sha:
        description: Exact 40-character pull request head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  owner-approval:
    name: owner-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging-approval
    steps:
      - name: Verify current pull request head and approve that exact SHA
        uses: actions/github-script@v8
        with:
          script: |
            const pullRequestNumber = Number(context.payload.inputs.pull_request_number);
            const expectedSha = context.payload.inputs.head_sha;
            if (!Number.isSafeInteger(pullRequestNumber) || pullRequestNumber <= 0) {
              core.setFailed('OWNER_APPROVAL_INVALID_PULL_REQUEST');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(expectedSha)) {
              core.setFailed('OWNER_APPROVAL_INVALID_SHA');
              return;
            }
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequestNumber,
            });
            if (pull.state !== 'open' || pull.base.ref !== 'staging') {
              core.setFailed('OWNER_APPROVAL_WRONG_PULL_REQUEST_TARGET');
              return;
            }
            if (pull.head.sha !== expectedSha) {
              core.setFailed('OWNER_APPROVAL_STALE_SHA');
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: expectedSha,
              state: 'success',
              context: 'owner-approval',
              description: 'Owner approved this exact PR head SHA',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
