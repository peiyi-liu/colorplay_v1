name: Isolated Local chapter map diagnostic

on:
  push:
    branches:
      - codex/local-chapter-map-diagnostic-20261119

permissions:
  contents: read

concurrency:
  group: colorplay-local-chapter-map-diagnostic
  cancel-in-progress: false

jobs:
  chapter-map-diagnostic:
    if: github.repository == 'peiyi-liu/colorplay_v1' && github.run_attempt == 1 && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: colorplay-live-recovery
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: colorplay-live-recovery
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Set up pnpm from packageManager
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: pnpm
          cache-dependency-path: colorplay-live-recovery/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run fixed ephemeral Local experiment
        run: python3 -B scripts/concurrency/diagnose-chapter-map-read.py --run
      - name: Validate only the closed public numeric projection
        id: projection
        if: ${{ always() && !cancelled() }}
        run: python3 -B scripts/concurrency/diagnose-chapter-map-read.py --validate
      - name: Upload only validated safe diagnostic
        if: ${{ always() && !cancelled() && steps.projection.outputs.safe_artifact == 'true' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: local-chapter-map-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chapter-map-diagnostic/safe-result.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
