name: Production restore drill

on:
  workflow_dispatch:
    inputs:
      backup_prefix:
        description: Exact immutable B2 backup prefix ending in slash
        required: true
        type: string
      source_sha:
        description: Exact repository SHA recorded by the backup manifest
        required: true
        type: string

concurrency: production-restore-drill

permissions:
  contents: read

jobs:
  restore-drill:
    name: restore-production-backup-to-isolated-local
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-recovery
    env:
      AGE_IDENTITY: ${{ secrets.AGE_IDENTITY }}
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_BUCKET: ${{ vars.B2_BUCKET }}
      B2_REGION: ${{ vars.B2_REGION }}
      B2_RECOVERY_KEY_ID: ${{ secrets.B2_RECOVERY_KEY_ID }}
      B2_RECOVERY_APPLICATION_KEY: ${{ secrets.B2_RECOVERY_APPLICATION_KEY }}
      BACKUP_PREFIX: ${{ inputs.backup_prefix }}
      RESTORE_EXPECTED_REPO_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Check out the manifest source SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
      - name: Validate immutable backup identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKUP_PREFIX" =~ ^production/[0-9]{4}/[0-9]{2}/[0-9]{2}/backup-[0-9]{8}T[0-9]{6}Z/$ ]] || {
            printf '%s\n' 'RESTORE_BACKUP_PREFIX_INVALID' >&2
            exit 1
          }
          [[ "$RESTORE_EXPECTED_REPO_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$RESTORE_EXPECTED_REPO_SHA" ]] || exit 1
      - name: Set up pnpm from packageManager
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install age
        run: sudo apt-get update && sudo apt-get install --yes age
      - name: Download the complete immutable set with recovery-only credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw_root="$RUNNER_TEMP/colorplay-restore-download"
          backup_root="$RUNNER_TEMP/colorplay-restore-backup"
          mkdir -p "$raw_root" "$backup_root/encrypted"
          AWS_ACCESS_KEY_ID="$B2_RECOVERY_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$B2_RECOVERY_APPLICATION_KEY" \
            AWS_DEFAULT_REGION="$B2_REGION" \
            aws s3 sync --only-show-errors \
              --endpoint-url "$B2_ENDPOINT" \
              "s3://$B2_BUCKET/$BACKUP_PREFIX" \
              "$raw_root"
          while IFS= read -r source_path; do
            relative_path="${source_path#"$raw_root"/}"
            [[ "$relative_path" != /* && "$relative_path" != *..* && "$relative_path" != *\\* ]] || exit 1
            case "$relative_path" in
              backup-manifest.json.age|backup-manifest.json.age.sha256)
                cp "$source_path" "$backup_root/$relative_path"
                ;;
              *.age)
                mkdir -p "$backup_root/encrypted/$(dirname "$relative_path")"
                cp "$source_path" "$backup_root/encrypted/$relative_path"
                ;;
              *)
                exit 1
                ;;
            esac
          done < <(find "$raw_root" -type f -print | LC_ALL=C sort)
          [[ -f "$backup_root/backup-manifest.json.age" ]] || exit 1
          [[ -f "$backup_root/backup-manifest.json.age.sha256" ]] || exit 1
          printf '%s' "$AGE_IDENTITY" > "$RUNNER_TEMP/age-identity.txt"
      - name: Restore roles, schema, data and Storage to isolated Local Supabase
        env:
          AGE_IDENTITY_FILE: ${{ runner.temp }}/age-identity.txt
        run: |
          pnpm phase0:restore:local -- \
            --target local \
            --backup-root "$RUNNER_TEMP/colorplay-restore-backup"
      - name: Secret-scan sanitized restore evidence
        id: evidence-scan
        shell: bash
        run: |
          credential_pattern='(?i)(eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|sb_secret_[A-Za-z0-9_-]{16,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|postgres(?:ql)?://[^[:space:]]+)'
          ! rg --pcre2 -q "$credential_pattern" \
            "$RUNNER_TEMP/colorplay-restore-backup/restore-report.json"
      - name: Upload sanitized restore result
        if: ${{ success() && steps.evidence-scan.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: production-restore-drill-result
          path: ${{ runner.temp }}/colorplay-restore-backup/restore-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove recovery material and downloaded backup
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/age-identity.txt"
          rm -rf \
            "$RUNNER_TEMP/colorplay-restore-download" \
            "$RUNNER_TEMP/colorplay-restore-backup"
