name: Feature CI

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: read

env:
  CI: 'true'
  VITE_SUPABASE_URL: https://synthetic-colorplay-ci.invalid
  VITE_SUPABASE_ANON_KEY: synthetic-browser-public-anon-key

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm from packageManager
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm from packageManager
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm from packageManager
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  unit-coverage:
    name: unit-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm from packageManager
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for evidence contracts
        run: pnpm exec playwright install --with-deps chromium
      - name: Install age for encrypted backup contracts
        run: sudo apt-get update && sudo apt-get install --yes age
      - name: Run stack-independent unit coverage
        run: pnpm test:coverage

  production-build:
    name: production-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm from packageManager
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production application
        run: npm run build

  local-database:
    name: local-database
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm from packageManager
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test clean seeded Local Supabase
        run: pnpm test:db

  chromium-e2e:
    name: chromium-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm from packageManager
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and operating-system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Reset and seed an isolated Local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec supabase start >/dev/null 2>&1
          pnpm exec supabase db reset --local
          source scripts/supabase/load-local-environment.sh
          load_local_supabase_environment \
            < <(pnpm exec supabase status -o env 2>/dev/null)
          export SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
          pnpm exec tsx scripts/supabase/seed-auth.ts
      - name: Build and test the Local stack through Chromium
        shell: bash
        run: |
          set -euo pipefail
          source scripts/supabase/load-local-environment.sh
          load_local_supabase_environment \
            < <(pnpm exec supabase status -o env 2>/dev/null)
          export SUPABASE_URL SUPABASE_ANON_KEY
          export VITE_SUPABASE_URL="$SUPABASE_URL"
          export VITE_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          pnpm build
          pnpm preview --host 127.0.0.1 --port 4173 > /tmp/colorplay-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          pnpm test:e2e --project=chromium

  credential-scan:
    name: credential-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm from packageManager
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Rebuild bundle with synthetic public config
        run: npm run build
      - name: Scan source, bundle, and evidence for credentials
        id: secret-scan
        shell: bash
        run: |
          set -euo pipefail
          report_directory=artifacts/phase0/ci
          report_path="$report_directory/credential-scan.txt"
          mkdir -p "$report_directory"
          credential_value_pattern='(?i)(eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|sb_secret_[A-Za-z0-9_-]{16,}|(?:postgres(?:ql)?|mysql)://[^[:space:]]+:[^@[:space:]]+@|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          if rg --hidden --pcre2 -q \
            --glob '!.git/**' \
            --glob '!node_modules/**' \
            --glob '!credential-scan.txt' \
            "$credential_value_pattern" .; then
            printf 'findings=detected\ndetails=withheld\n' > "$report_path"
            exit 1
          fi
          if rg -q '^\s+VITE_[A-Z0-9_]*(SERVICE|ROLE|DATABASE|PASSWORD|JWT|SECRET)[A-Z0-9_]*:' \
            .github/workflows/ci.yml; then
            printf 'findings=detected\ndetails=withheld\n' > "$report_path"
            exit 1
          fi
          printf 'findings=0\nscope=current-tree,dist,evidence\n' > "$report_path"
      - name: Upload scanned CI evidence
        uses: actions/upload-artifact@v5
        if: ${{ success() && steps.secret-scan.outcome == 'success' }}
        with:
          name: feature-ci-credential-scan
          path: artifacts/phase0/ci/
          if-no-files-found: error
          retention-days: 14
