name: Foundation CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation-ci:
    name: foundation-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      VITE_SUPABASE_URL: https://synthetic-colorplay-ci.invalid
      VITE_SUPABASE_ANON_KEY: synthetic-browser-public-anon-key
      # PLAYWRIGHT_EVIDENCE_ROOT / PLAYWRIGHT_TRACE 不得在 job 層設定：
      # evidence-manifest contract 要求 playwright-local-* 預設樣式與
      # trace on-first-retry；e2e 失敗證據（截圖/影片/trace）依 config
      # 預設保留，並經 artifacts/acceptance/** 整批上傳。
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # pnpm/action-setup 的 self-installer 自本 repo 首次 run 起穩定失敗
      # （annotation: "self-installer exits with code 1"，29/29 紅）；改用
      # npm 依 packageManager pin 安裝——版本仍唯一來自 package.json。
      - name: Set up pnpm from packageManager
        run: npm install --global "$(node --print "require('./package.json').packageManager")"

      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run stack-independent unit coverage
        shell: bash
        run: |
          set -o pipefail
          pnpm test:coverage 2>&1 | tee coverage-run.log

      # coverage 失敗時把尾段輸出轉成 annotations——logs API 需認證，
      # annotations 可匿名讀取，供診斷「無測試失敗的 exit 1」。
      - name: Surface coverage failure detail
        if: failure()
        shell: bash
        run: |
          # GitHub 每步僅保留前 10 條 annotations——只吐總結與錯誤行。
          grep -E "ERROR|does not meet|Error|All files|Test Files|Tests  " \
            coverage-run.log | tail -n 10 | while IFS= read -r line; do
            printf '::error::COV %s\n' "$line"
          done

      - name: Build production application
        run: npm run build

      - name: Test seeded local database and real-stack integration
        run: pnpm test:db

      - name: Install Chromium and operating-system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium end-to-end tests against the built preview
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          # e2e 走真實本機 stack（test:db 已啟動並播種）：以真實環境重建
          # bundle——synthetic URL 的 bundle 無法完成登入等真實旅程；
          # Live smoke 也需要 SUPABASE_URL 才不會被 skip。
          source scripts/supabase/load-local-environment.sh
          load_local_supabase_environment \
            < <(pnpm exec supabase status -o env 2>/dev/null)
          export SUPABASE_URL SUPABASE_ANON_KEY
          export VITE_SUPABASE_URL="$SUPABASE_URL"
          export VITE_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          pnpm build
          mkdir -p artifacts/acceptance/phase-1a-task-08/reports
          pnpm preview --host 127.0.0.1 --port 4173 \
            > artifacts/acceptance/phase-1a-task-08/reports/vite-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          pnpm test:e2e --project=chromium

      # e2e 用真實本機環境重建過 dist；掃描前還原 synthetic 版本，
      # 維持「bundle 內不得出現任何憑證樣態」的掃描語意。
      - name: Rebuild bundle with synthetic env for credential scan
        run: npm run build

      - name: Scan source, bundle, and evidence for credentials
        id: secret-scan
        shell: bash
        run: |
          report_directory=artifacts/acceptance/phase-1a-task-08/reports
          report_path="$report_directory/ci-secret-scan.txt"
          mkdir -p "$report_directory"

          credential_value_pattern='(?i)(eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|sb_secret_[A-Za-z0-9_-]{16,}|(?:postgres(?:ql)?|mysql)://[^[:space:]]+:[^@[:space:]]+@|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          if rg --hidden --pcre2 -q \
            --glob '!.git/**' \
            --glob '!node_modules/**' \
            --glob '!ci-secret-scan.txt' \
            "$credential_value_pattern" .; then
            printf 'findings=detected\ndetails=withheld\n' > "$report_path"
            exit 1
          fi

          while IFS= read -r archive; do
            if unzip -p "$archive" | rg --pcre2 -q "$credential_value_pattern"; then
              printf 'findings=detected\ndetails=withheld\n' > "$report_path"
              exit 1
            fi
          done < <(find artifacts/acceptance -type f -name '*.zip' -print)

          if rg -q '^\s+VITE_[A-Z0-9_]*(SERVICE|ROLE|DATABASE|PASSWORD|JWT|SECRET)[A-Z0-9_]*:' \
            .github/workflows/ci.yml; then
            printf 'findings=detected\ndetails=withheld\n' > "$report_path"
            exit 1
          fi

          printf 'findings=0\nscope=current-tree,dist,coverage,acceptance-artifacts,expanded-traces\n' \
            > "$report_path"

      - name: Upload scanned foundation evidence
        uses: actions/upload-artifact@v5
        if: ${{ success() && steps.secret-scan.outcome == 'success' }}
        with:
          name: foundation-ci-evidence
          path: |
            artifacts/acceptance/
            coverage/
          if-no-files-found: error
          retention-days: 14
